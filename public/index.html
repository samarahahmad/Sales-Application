<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WSC Sales">
<title>Water Secret Contracting &middot; Sales</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-bar">
  <button class="app-bar__back" id="backBtn" hidden aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="app-bar__title">
    <span class="app-bar__company">Water Secret Contracting</span>
    <span class="app-bar__screen" id="screenTitle">Sales Opportunity</span>
  </div>
  <button class="app-bar__action" id="listBtn" aria-label="My registrations">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<div class="progress" id="progress" hidden>
  <div class="progress__bar"><span class="progress__fill" id="progressFill"></span></div>
  <div class="progress__label" id="progressLabel"></div>
</div>

<div class="offline-banner" id="offlineBanner" hidden>You are offline &mdash; the opportunity will be sent automatically when you get signal.</div>

<main id="main" class="main"></main>

<footer class="nav-bar" id="navBar" hidden>
  <button class="btn btn--ghost" id="prevBtn">Back</button>
  <button class="btn btn--primary" id="nextBtn">Next</button>
</footer>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__header"><h2 id="sheetTitle"></h2><button class="sheet__close" data-close aria-label="Close">&times;</button></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
